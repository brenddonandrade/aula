# Mantém o servidor reserva (Render, plano grátis) acordado: ele dorme após 15 min sem acesso e, ao acordar,
# começa com o disco vazio. Normalmente o servidor de casa já o mantém acordado; isto cobre a casa fora do ar.
name: manter-nuvem-acordada
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://diagnosticolab.onrender.com/api/health
